[project]
name = "chat-api"
version = "1.0.0"
description = "Drop-in AI assistant backend for websites: streaming chat, pluggable LLM providers, optional knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
