# Shared, non-secret settings for the chat-api Cloud Run service.
# Deploy with: --env-vars-file=deployments/env.yaml (see deployments/README.md)
# Secrets (AH_STUDIO_GEMINI_API_KEY, ORCTECH_GEMINI_API_KEY, PINECONE_API_KEY)
# are attached separately with --update-secrets.

APP_NAME: "Chat API"
APP_DESCRIPTION: "Website assistants for allisonhe.ca and orctech.ca"
APP_ENV: "production"
LOG_LEVEL: "INFO"

TENANTS_FILE: "deployments/tenants.yaml"

RATE_LIMIT_WINDOW: "60"
MAX_MESSAGES_PER_SESSION: "20"
MAX_CONTEXT_MESSAGES: "10"

# Knowledge base (shared Pinecone index; tenants use namespaces)
PINECONE_INDEX: "chat-api-rag-ahstudio"
GCS_BUCKET: "ah-studio-chat-rag"
GCS_PREFIX: "documents"
